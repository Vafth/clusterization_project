apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-service
  labels:
    app: notes-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notes-service
  template:
    metadata:
      labels:
        app: notes-service
    spec:
      containers:
      - name: notes-service
        image: notes-service:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://admin:password123@postgres:5432/microservices"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notes-service
  labels:
    app: notes-service
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: notes-service